version: '3'

vars:
  BINARY: bin/reviewer

tasks:
  default:
    desc: Список доступных задач
    cmds:
      - task --list

  deps:
    desc: Скачать зависимости
    cmds:
      - go mod download

  build:
    desc: Собрать приложение
    cmds:
      - go build -trimpath -o {{.BINARY}} ./cmd/server
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
    generates:
      - '{{.BINARY}}'

  run:
    desc: Запустить приложение
    deps: [build]
    cmds:
      - '{{.BINARY}}'

  test:
    desc: Тесты без интеграционных
    cmds:
      - go test -race ./...

  test:integration:
    desc: Тесты с проверкой доступа к данным (нужен TEST_DATABASE_URL)
    cmds:
      - go test -race -run . -v ./internal/database/
    env:
      TEST_DATABASE_URL: '{{.TEST_DATABASE_URL | default ""}}'

  cover:
    desc: Тесты с отчётом о покрытии
    cmds:
      - go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out
    generates:
      - coverage.out

  lint:
    desc: Форматирование и статический анализ
    cmds:
      - test -z "$(gofmt -l . | grep -v '^$$' || true)"
      - go vet ./...

  fmt:
    desc: Отформатировать код
    cmds:
      - gofmt -w .

  up:
    desc: Поднять приложение и базу в Docker
    cmds:
      - docker compose up --build

  down:
    desc: Остановить контейнеры
    cmds:
      - docker compose down -v

  migr:up:
    desc: Применить миграции
    cmds:
      - |
        source .env
        migrate -path db/migrations -database "$DATABASE_URL" up

  migr:down:
    desc: Откатить последнюю миграцию
    cmds:
      - |
        source .env
        migrate -path db/migrations -database "$DATABASE_URL" down 1

  migr:new:
    desc: Создать миграцию: task migr:new имя
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "Укажите имя: task migr:new add_reviews_table"
          exit 1
        fi
        migrate create -ext sql -dir db/migrations "{{.CLI_ARGS}}"